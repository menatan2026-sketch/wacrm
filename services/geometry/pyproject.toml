[project]
name = "mfg-geometry"
version = "0.1.0"
description = "Sandboxed mesh analysis for the manufacturing platform (ADR-0006)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "trimesh>=4.5,<5",
  "numpy>=2.1,<3",
  "lxml>=5.3,<7",
  "networkx>=3.4,<4",
  "scipy>=1.14,<2",
  "rtree>=1.3,<2",
  "fast-simplification>=0.1.9,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.8,<1"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
