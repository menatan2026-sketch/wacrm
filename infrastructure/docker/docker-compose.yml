# Local development databases. Usage: docker compose -f infrastructure/docker/docker-compose.yml up -d
# Matches .env.example: postgres://mfg@127.0.0.1:5432/mfg (+ mfg_test) and redis://127.0.0.1:6379.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mfg
      POSTGRES_DB: mfg
      # Local development only: trust auth on a port bound to 127.0.0.1.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mfg"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    command: ["redis-server", "--save", ""]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
