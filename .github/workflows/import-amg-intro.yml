# One-off: pull the amg-gt-suv-intro Vercel deployment into amg-gt-suv-intro/ and commit it.
name: Import amg-gt-suv-intro from Vercel
on:
  push:
    branches: [claude/compassionate-bardeen-x8n93g]
    paths: [.github/workflows/import-amg-intro.yml, amg-gt-suv-intro/.files.txt]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          base=https://amg-gt-suv-intro.vercel.app
          cd amg-gt-suv-intro
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "$(dirname "$f")"
            code=$(curl -sS -L --retry 3 -o "$f" -w '%{http_code}' "$base/$f")
            echo "$code $(stat -c%s "$f") $f"
            [ "$code" = 200 ] || { echo "MISSING: $f"; rm -f "$f"; echo "$code $f" >> .missing.txt; }
          done < .files.txt
          [ -f .missing.txt ] && cat .missing.txt || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add amg-gt-suv-intro
          git commit -m "Import amg-gt-suv-intro site files from Vercel deployment" || echo "nothing to commit"
          git push
