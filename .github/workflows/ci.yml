name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Non-secret placeholder values for tests only. Real secrets never live in the repository.
env:
  NODE_ENV: test
  APP_ENV: ci
  APP_URL: http://localhost:3000
  APP_SECRET: ci-only-app-secret-0000000000000000000000000000000000000000000000
  DATABASE_URL: postgres://mfg@127.0.0.1:5432/mfg
  TEST_DATABASE_URL: postgres://mfg@127.0.0.1:5432/mfg_test
  REDIS_URL: redis://127.0.0.1:6379
  GEOMETRY_URL: http://127.0.0.1:8001
  GEOMETRY_SHARED_SECRET: ci-only-geometry-secret-000
  PAYMENT_PROVIDER: fake
  PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret-0000
  SHIPPING_PROVIDER: fake
  EMAIL_DRIVER: log
  STORAGE_DRIVER: local
  DEV_TOOLS_ENABLED: "true"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, catalogs, unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mfg
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mfg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mfg" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test

  geometry:
    name: Geometry service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/geometry
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: E2E (he/en/ru × desktop/mobile)
    needs: [checks, geometry]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mfg
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mfg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mfg" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm --filter @mfg/web build
      - name: Start geometry, worker and web
        run: |
          (cd services/geometry && uv sync --frozen && uv run uvicorn geometry.app:app --host 127.0.0.1 --port 8001 > /tmp/geometry.log 2>&1 &)
          (cd apps/worker && npx tsx src/main.ts > /tmp/worker.log 2>&1 &)
          (cd apps/web && npx next start --port 3000 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/readyz && exit 0; sleep 2; done
          echo "stack did not become ready"; exit 1
      - run: pnpm --filter @mfg/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - if: failure()
        run: tail -n 200 /tmp/web.log /tmp/worker.log /tmp/geometry.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
